name: Build Android ARM64 Co-op Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone Dobby Hook Source
        run: |
          echo "[*] Cloning Dobby source code from GitHub..."
          rm -rf Dobby dobby
          git clone --depth 1 --recurse-submodules https://github.com/jmpews/Dobby.git Dobby
          echo "[+] Dobby repository cloned successfully."

      - name: Compile libcoop_fp.so
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4

      - name: Verify Binary
        run: |
          ls -lh build/libcoop_fp.so
          file build/libcoop_fp.so

      - name: Upload libcoop_fp.so
        uses: actions/upload-artifact@v4
        with:
          name: libcoop_fp_arm64
          path: build/libcoop_fp.so
