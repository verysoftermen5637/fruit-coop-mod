name: Build Android ARM64 Co-op Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Dobby Hook Static Library
        run: |
          echo "[*] Cloning Dobby..."
          rm -rf dobby_src build_dobby dobby
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby_src

          echo "[*] Compiling libdobby.a for arm64-v8a..."
          cmake -B build_dobby -S dobby_src \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_DEBUG=OFF

          cmake --build build_dobby -j4

          mkdir -p dobby/lib dobby/include
          find build_dobby -name "libdobby.a" | head -n 1 | xargs -I {} cp {} dobby/lib/libdobby.a
          cp dobby_src/include/dobby.h dobby/include/dobby.h
          ls -lh dobby/lib/libdobby.a dobby/include/dobby.h

      - name: Compile libcoop_fp.so
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Verify Binary
        run: |
          ls -lh build/libcoop_fp.so
          file build/libcoop_fp.so

      - name: Upload libcoop_fp.so
        uses: actions/upload-artifact@v4
        with:
          name: libcoop_fp_arm64
          path: build/libcoop_fp.so
